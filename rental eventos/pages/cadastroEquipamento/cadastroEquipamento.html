<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Equipamento - Festaê</title>

    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <header class="cabecalho">

        <h1 class="logo">Festaê 🎉</h1>

        <nav class="menu">
            <a href="../principal/principal.html">Início</a>
            <a href="../equipamentos/equipamentos.html">Equipamentos</a>
            <a href="../cadastroEquipamento/cadastroEquipamento.html">
                Cadastrar equipamento
            </a>
            <a href="../login/login.html">Sair</a>
        </nav>

    </header>


    <main>

        <section class="cadastro-equipamento">

            <h2>Cadastrar equipamento</h2>

            <form>

                <label for="nomeEquipamento">
                    Nome do equipamento:
                </label>

                <input
                    type="text"
                    id="nomeEquipamento"
                    name="nomeEquipamento"
                    placeholder="Digite o nome do equipamento"
                    required
                >


                <label for="descricao">
                    Descrição:
                </label>

                <textarea
                    id="descricao"
                    name="descricao"
                    placeholder="Digite uma descrição"
                ></textarea>


                <label for="quantidade">
                    Quantidade:
                </label>

                <input
                    type="number"
                    id="quantidade"
                    name="quantidade"
                    min="1"
                    required
                >


                <label for="categoria">
                    Categoria:
                </label>

                <input
                    type="text"
                    id="categoria"
                    name="categoria"
                    placeholder="Ex: Som, iluminação..."
                    required
                >


                <label for="status">
                    Status:
                </label>

                <select id="status" name="status">

                    <option value="disponivel">
                        Disponível
                    </option>

                    <option value="indisponivel">
                        Indisponível
                    </option>

                </select>


                <button type="submit">
                    Cadastrar equipamento
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Festaê - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
