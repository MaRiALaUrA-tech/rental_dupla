<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Rental Eventos</title>
</head>

<body>

    <h1>Cadastro</h1>

    <form>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha">

        <br><br>

        <label for="confirmarSenha">Confirmar senha:</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha">

        <br><br>

         <label for="cpf">Cpf:</label>
        <input type="cpf" id="cpf" name="cpf">

        <br><br>

         <label for="tipoUsuario">Tipo Usuário:</label>
        <input type="tipoUsuario" id="tipoUsuario" name="tipoUsuario">

        <br><br>

         <label for="condigoVerifFunc">Código de Verificação:</label>
        <input type="condigoVerifFunc" id="condigoVerifFunc" name="condigoVerifFunc">

        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

    <p>
        Já possui uma conta?
        <a href="../login/login.html">Voltar para o login</a>
    </p>

</body>

</html>
