<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Festaê</title>
    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <h1>Cadastro</h1>

    <div class="cadastro-container">

    <div class="cadastro-card">

        <h1 class="logo-cadastro">Festaê 🎉</h1>

        <h2>Crie sua conta</h2>

        <p class="cadastro-subtitulo">
            Cadastre-se para começar a alugar seus equipamentos.
        </p>


        <form>

            <div class="campo">
                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>


            <div class="campo">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>


            <div class="campo">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>


            <div class="campo">
                <label for="confirmarSenha">Confirmar senha</label>

                <input
                    type="password"
                    id="confirmarSenha"
                    name="confirmarSenha"
                    placeholder="Confirme sua senha"
                    required
                >
            </div>


            <div class="campo">
                <label for="cpf">CPF</label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="Digite seu CPF"
                    required
                >
            </div>


            <div class="campo">
                <label for="tipoUsuario">Tipo de usuário</label>

                <input
                    type="text"
                    id="tipoUsuario"
                    name="tipoUsuario"
                    placeholder="Digite o tipo de usuário"
                    required
                >
            </div>


            <div class="campo">
                <label for="condigoVerifFunc">
                    Código de verificação
                </label>

                <input
                    type="text"
                    id="condigoVerifFunc"
                    name="condigoVerifFunc"
                    placeholder="Digite o código de verificação"
                >
            </div>


            <button class="botao-cadastro" type="submit">
                Cadastrar
            </button>

        </form>


        <p class="voltar-login">
            Já possui uma conta?
            <a href="../login/login.html">
                Voltar para o login
            </a>
        </p>

    </div>

</div>

</body>

</html>
